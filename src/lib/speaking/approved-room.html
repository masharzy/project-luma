<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Room · JumpToNine</title>
<style>
@font-face{font-family:'Instrument Sans';font-weight:400;src:url('/fonts/home/home-5.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Instrument Sans';font-weight:500;src:url('/fonts/home/home-6.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Instrument Sans';font-weight:600;src:url('/fonts/home/home-7.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Bricolage Grotesque';font-weight:500 800;src:url('/fonts/home/bricolage-variable.woff2') format('woff2');font-display:swap}
:root{color-scheme:only light;--bg:#FDFBF7;--surface:#fff;--ink:#2A0F16;--muted:#6A4852;--line:rgba(123,18,48,.18);--accent:#C8082F;--wine:#7B1230;--soft:#FBE6EA;--sand:#F3EADC;--ring:rgba(200,8,47,.35);--on-accent:#fff;--display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;--lvl:0}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,textarea:focus-visible,audio:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.topbar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-inner{max-width:1040px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 1.4rem var(--display);letter-spacing:-.05em}.top-actions{display:flex;align-items:center;gap:14px}
.clock,.tag{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;white-space:nowrap}
.clock{font:700 1.1rem var(--display);color:var(--ink)}
.layout{width:min(100% - 40px,860px);margin:clamp(20px,4vw,44px) auto 150px;display:grid;gap:18px}
.heading{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
.eyebrow,.question-meta{font:600 .7rem 'Instrument Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1,h2,p{margin:0}h1{font:600 clamp(1.6rem,4vw,2.4rem)/1.1 var(--display);letter-spacing:-.035em;margin-top:4px}
.part-tabs,.control-actions,.tools{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.part-tab,.secondary-button,.exit,.replay-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border:1px solid var(--line);background:var(--surface);padding:0 16px;border-radius:2px;font-weight:600;transition:background .2s,border-color .2s,color .2s}
.part-tab:hover:not(:disabled),.secondary-button:hover:not(:disabled),.exit:hover:not(:disabled),.replay-button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.part-tab[aria-pressed=true]{color:#fff;background:var(--ink);border-color:var(--ink)}
.record-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:190px;padding:0 28px;border:0;border-radius:2px;background:var(--accent);color:var(--on-accent);font:600 1rem 'Instrument Sans',sans-serif;transition:background .2s}
.record-button:hover:not(:disabled){background:var(--wine)}
.is-recording .record-button,.record-button.recording{background:var(--ink)}
/* Stage: a single circle that breathes with the voice (examiner or learner) */
.stage{position:relative;display:grid;justify-items:center;text-align:center;padding:clamp(18px,4vw,40px) 12px 6px;gap:10px;background:radial-gradient(60% 70% at 50% 38%,var(--soft),transparent 70%)}
.orb{--size:clamp(150px,30vw,220px);position:relative;width:var(--size);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ff5a78,var(--accent) 55%,var(--wine));box-shadow:0 18px 50px -12px rgba(200,8,47,.55);transform:scale(calc(1 + var(--lvl)*.07));transition:transform .08s linear}
.orb::before,.orb::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--ring);pointer-events:none;transition:opacity .3s}
.orb::before{transform:scale(calc(1.14 + var(--lvl)*.22));opacity:.55}
.orb::after{transform:scale(calc(1.3 + var(--lvl)*.36));opacity:.25}
.is-speaking .orb,.is-recording .orb{opacity:1}
.stage:not(.is-speaking):not(.is-recording) .orb{animation:orb-idle 4.2s ease-in-out infinite}
@keyframes orb-idle{50%{transform:scale(1.03)}}
.wave{width:56%;height:34%;display:flex;justify-content:center;align-items:center;gap:4px;color:#fff}
.wave i{flex:1;max-width:5px;height:100%;transform:scaleY(.1);background:currentColor;border-radius:9px;transition:transform .09s linear;opacity:.92}
.voice-fallback:is(.is-speaking,.is-recording) .wave i{animation:wave-pulse .65s ease-in-out infinite alternate}
.voice-fallback .wave i:nth-child(3n){animation-delay:-.18s}.voice-fallback .wave i:nth-child(2n){animation-delay:-.35s}
@keyframes wave-pulse{to{transform:scaleY(.74)}}
.examiner{font:600 .95rem var(--display);letter-spacing:-.01em;margin-top:14px}
.room-status{color:var(--muted);min-height:24px;font-size:.9rem}
.tools{justify-content:center}
/* Question */
.question-card{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px 20px;padding:22px 24px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:2px}
.question-card p{font:500 clamp(1.15rem,2.8vw,1.6rem)/1.35 var(--display);letter-spacing:-.02em;margin-top:6px;white-space:pre-line;overflow-wrap:anywhere}
.replay-button svg{width:18px;height:18px}
/* Cue card + notes */
.preparation{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;perspective:900px}
.preparation:has([hidden]){grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr))}
.paper{padding:20px;border:1px solid var(--line);border-radius:2px;background:var(--surface);min-width:0;box-shadow:0 14px 34px -18px rgba(42,15,22,.35);transform-origin:50% 0;animation:card-in .5s cubic-bezier(.2,.8,.2,1) both}
#paper-overlay{border-top:4px solid var(--accent)}
.notes-panel{background:var(--sand);border-color:rgba(123,18,48,.22);animation:notes-in .5s .1s cubic-bezier(.2,.8,.2,1) both}
.paper-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.paper h2{font:600 1.25rem/1.3 var(--display);letter-spacing:-.02em;margin-bottom:8px;overflow-wrap:anywhere}.paper p,.paper li{white-space:pre-line;overflow-wrap:anywhere}
.paper ul{padding-left:20px;margin:8px 0}.source-card-image{max-width:100%;display:block;margin-top:10px}
.paper textarea{width:100%;min-height:160px;resize:vertical;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,.7);padding:12px;font-size:1rem}
@keyframes card-in{from{opacity:0;transform:translateY(-18px) rotateX(-12deg)}to{opacity:1;transform:none}}
@keyframes notes-in{from{opacity:0;transform:translateX(24px) rotate(1.5deg)}to{opacity:1;transform:none}}
#tp{height:3px;background:var(--accent);width:0;transition:width .2s}
/* Controls: always in reach */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(20px,calc((100% - 860px)/2)) max(12px,env(safe-area-inset-bottom));background:rgba(253,251,247,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.controls strong{font:600 1rem var(--display)}.controls small{display:block;color:var(--muted);margin-top:1px;font-size:.8rem}
.control-actions{justify-content:flex-end}
.review-strip{display:flex;align-items:center;gap:8px}.review-strip audio{width:min(220px,100%);height:38px}
.complete-overlay{position:fixed;inset:0;z-index:8;background:rgba(42,15,22,.55);display:grid;place-items:center;padding:20px}
.complete-overlay>div{width:min(100%,460px);max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);padding:28px;border-radius:2px}
.complete-overlay h2{font:600 1.5rem var(--display);letter-spacing:-.03em}
.complete-overlay p{margin:10px 0 15px}.complete-overlay button{margin:5px 5px 0 0}#answer-downloads a{display:block;color:var(--wine);padding:4px 0}
.toast{position:fixed;left:50%;bottom:96px;z-index:9;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);border:1px solid var(--line);border-radius:2px;background:var(--ink);color:#fff;padding:10px 16px}
@media(max-width:640px){.top-inner{padding:10px 16px}.layout{width:calc(100% - 28px);margin-bottom:190px}.question-card{grid-template-columns:1fr;padding:18px}.replay-button{width:100%}.preparation{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch;gap:10px;padding:10px 14px max(10px,env(safe-area-inset-bottom))}.control-actions{justify-content:stretch;flex-wrap:wrap}.record-button{flex:1 1 100%;order:9;min-height:54px}.review-strip{width:100%}.review-strip audio{flex:1;width:auto}.toast{bottom:210px}.part-tab{padding:0 12px;min-height:38px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.orb{transform:none}}
</style>
</head>
<body>
<header class="topbar"><div class="top-inner"><div class="brand">JumpToNine</div><div class="top-actions"><span class="clock" id="room-clock" role="timer" aria-label="Speaking time remaining"></span><button class="exit" id="exit" type="button">Leave room</button></div></div><div id="tp" aria-hidden="true"></div></header>
<main class="layout">
  <div class="heading"><div><div class="eyebrow">IELTS Speaking</div><h1>Speaking room</h1></div><nav class="part-tabs" aria-label="Speaking parts"></nav></div>
  <section class="stage" id="stage" aria-label="Speaking examiner">
    <div class="orb" aria-hidden="true"><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="examiner">James Carter · Examiner</div>
    <div class="room-status" id="room-status" role="status">Ready when you are.</div>
    <div class="tools" id="room-tools" hidden><button class="secondary-button" id="desk-card" type="button" hidden aria-controls="paper-overlay" aria-expanded="false">Cue card</button><button class="secondary-button" id="desk-notes" type="button" hidden aria-controls="notes-panel" aria-expanded="false">Notes</button></div>
  </section>
  <section class="question-card"><div aria-live="polite"><div class="question-meta" id="question-meta">Your examiner</div><p id="question">Listen to each question, then record your answer.</p></div><button class="replay-button" id="replay" type="button" aria-label="Replay question" title="Replay question" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg><span>Replay</span></button></section>
  <section class="preparation" id="preparation" aria-label="Cue card and notes" hidden>
    <article class="paper" id="paper-overlay" hidden><div class="paper-head"><span class="tag">Cue card</span><strong class="clock" id="prep-clock" role="timer" aria-label="Preparation or speaking time remaining"></strong><button class="secondary-button" id="close-paper" type="button">Close</button></div><h2 id="cue-title"></h2><div id="cue-details"></div></article>
    <section class="paper notes-panel" id="notes-panel" hidden><div class="paper-head"><label class="tag" for="notes">Your notes</label><button class="secondary-button" id="close-notes" type="button">Close</button></div><textarea id="notes" placeholder="Write a few ideas…"></textarea></section>
  </section>
  <section class="controls" id="controls"><div><strong id="status-title">Start the interview</strong><small id="status-detail">Your microphone turns on when you record.</small><small id="saved-count" aria-live="polite"></small></div><div class="control-actions"><div class="review-strip" id="review" hidden><audio id="playback" controls aria-label="Listen to your recorded answer"></audio><button class="secondary-button" id="retake" type="button">Retake</button></div><button class="secondary-button" id="skip" type="button" hidden>Skip question</button><button class="record-button" id="main-action" type="button">Start speaking test</button></div></section>
</main>
<div class="complete-overlay" id="complete" hidden><div role="dialog" aria-modal="true" aria-labelledby="complete-title"><h2 id="complete-title">Speaking test complete</h2><p id="complete-text"></p><div id="answer-downloads"></div><button class="secondary-button" id="restart" type="button">Start again</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<!-- ROOM_RUNTIME -->
</body>
</html>
