<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Room · JumpToNine</title>
<style>
@font-face{font-family:Manrope;src:url('/fonts/font-2.woff2') format('woff2');font-display:swap}
:root{color-scheme:only light;--bg:#f8f7f5;--surface:#fff;--ink:#252321;--muted:#68635e;--line:#e5e0db;--accent:#9c3042;--soft:#f8e9eb;--ring:#e3bec5;--on-accent:#fff}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Manrope,system-ui,sans-serif}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.topbar{border-bottom:1px solid var(--line);background:var(--surface)}
.top-inner{max-width:1060px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.05em}.top-actions{display:flex;align-items:center;gap:12px}
.clock,.tag{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;white-space:nowrap}
.layout{width:min(100% - 40px,900px);margin:36px auto 28px}
.heading{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.eyebrow,.question-meta{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,p{margin:0}h1{font-size:clamp(25px,5vw,37px);letter-spacing:-.055em;line-height:1.15;margin-top:5px}
.part-tabs,.control-actions,.tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.part-tab,.secondary-button,.exit,.record-button,.icon-button{border:1px solid var(--line);background:var(--surface);padding:9px 13px;border-radius:4px;font-weight:750}
.part-tab[aria-pressed=true]{color:var(--accent);border-color:var(--ring);background:var(--soft)}
.record-button{color:var(--on-accent);background:var(--accent);border-color:var(--accent);min-width:138px}
.record-button:hover:not(:disabled),.secondary-button:hover:not(:disabled),.exit:hover:not(:disabled){filter:brightness(.94)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;justify-items:center;text-align:center;padding:clamp(24px,5vw,47px) 18px 23px;gap:11px}
.orb{width:clamp(104px,17vw,142px);aspect-ratio:1;border:1px solid var(--ring);border-radius:50%;display:grid;place-items:center;background:var(--soft);transition:box-shadow .25s}
.is-speaking .orb,.is-recording .orb{box-shadow:0 0 0 7px var(--soft)}
.wave{width:60%;height:45%;display:flex;justify-content:center;align-items:center;gap:4px;color:var(--accent)}
.wave i{flex:1;max-width:5px;height:100%;transform:scaleY(.1);background:currentColor;border-radius:9px;transition:transform .09s linear}
.voice-fallback:is(.is-speaking,.is-recording) .wave i{animation:wave-pulse .65s ease-in-out infinite alternate}
.voice-fallback .wave i:nth-child(3n){animation-delay:-.18s}.voice-fallback .wave i:nth-child(2n){animation-delay:-.35s}
@keyframes wave-pulse{to{transform:scaleY(.74)}}
.examiner{font-size:15px;font-weight:800;margin-top:4px}
.room-status{color:var(--muted);min-height:22px}
.tools{justify-content:center}
.question-card,.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:12px}
.question-card p{font-size:clamp(15px,2.4vw,19px);font-weight:750;margin-top:3px;white-space:pre-line;overflow-wrap:anywhere}
.icon-button{width:42px;height:42px;display:grid;place-items:center;padding:0;flex:none}
.icon-button svg{width:18px}
.controls small{display:block;color:var(--muted);margin-top:2px}
.control-actions{justify-content:flex-end}
.review-strip{display:flex;align-items:center;gap:8px}.review-strip audio{width:min(210px,100%);height:36px}
.preparation{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;margin-top:12px}
.preparation:has([hidden]){grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr))}
.paper{padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;animation:paper-in .42s cubic-bezier(.2,.75,.25,1) both}
.notes-panel{animation-delay:.08s}.paper-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.paper h2{font-size:18px;line-height:1.35;margin-bottom:8px;overflow-wrap:anywhere}.paper p,.paper li{white-space:pre-line;overflow-wrap:anywhere}
.paper ul{padding-left:20px;margin:8px 0}.source-card-image{max-width:100%;display:block;margin-top:10px}
.paper textarea{width:100%;min-height:144px;resize:vertical;border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:10px}
@keyframes paper-in{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
#tp{height:2px;background:var(--accent);width:0;transition:width .2s}
.complete-overlay{position:fixed;inset:0;z-index:2;background:#16121599;display:grid;place-items:center;padding:20px}
.complete-overlay>div{width:min(100%,460px);max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);padding:25px;border-radius:8px}
.complete-overlay p{margin:10px 0 15px}.complete-overlay button{margin:5px 5px 0 0}#answer-downloads a{display:block;color:var(--accent);padding:4px 0}
.toast{position:fixed;left:50%;bottom:18px;z-index:3;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:10px 14px}
@media(max-width:620px){.top-inner{padding:11px 16px}.layout{width:calc(100% - 28px);margin:20px auto}.controls{align-items:stretch;flex-direction:column;gap:12px}.control-actions{justify-content:stretch}.record-button{flex:1}.review-strip{width:100%}.review-strip audio{flex:1;width:auto}.preparation{grid-template-columns:1fr}.part-tab{padding:7px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar"><div class="top-inner"><div class="brand">JumpToNine</div><div class="top-actions"><span class="clock" id="room-clock" role="timer" aria-label="Speaking time remaining"></span><button class="exit" id="exit" type="button">Leave room</button></div></div><div id="tp" aria-hidden="true"></div></header>
<main class="layout">
  <div class="heading"><div><div class="eyebrow">IELTS Speaking</div><h1>Speaking room</h1></div><nav class="part-tabs" aria-label="Speaking parts"></nav></div>
  <section class="stage" id="stage" aria-label="Speaking examiner">
    <div class="orb" aria-hidden="true"><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="examiner">James Carter · Examiner</div>
    <div class="room-status" id="room-status" role="status">Ready when you are.</div>
    <div class="tools" id="room-tools" hidden><button class="secondary-button" id="desk-card" type="button" hidden aria-controls="paper-overlay" aria-expanded="false">Cue card</button><button class="secondary-button" id="desk-notes" type="button" hidden aria-controls="notes-panel" aria-expanded="false">Notes</button></div>
  </section>
  <section class="question-card"><div aria-live="polite"><div class="question-meta" id="question-meta">Your examiner</div><p id="question">Listen to each question, then record your answer.</p></div><button class="icon-button" id="replay" type="button" aria-label="Replay question" title="Replay question" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button></section>
  <section class="preparation" id="preparation" aria-label="Cue card and notes" hidden>
    <article class="paper" id="paper-overlay" hidden><div class="paper-head"><span class="tag">Cue card</span><strong class="clock" id="prep-clock" role="timer" aria-label="Preparation or speaking time remaining"></strong><button class="secondary-button" id="close-paper" type="button">Close</button></div><h2 id="cue-title"></h2><div id="cue-details"></div></article>
    <section class="paper notes-panel" id="notes-panel" hidden><div class="paper-head"><label class="tag" for="notes">Your notes</label><button class="secondary-button" id="close-notes" type="button">Close</button></div><textarea id="notes" placeholder="Write a few ideas…"></textarea></section>
  </section>
  <section class="controls" id="controls"><div><strong id="status-title">Start the interview</strong><small id="status-detail">Your microphone turns on when you record.</small><small id="saved-count" aria-live="polite"></small></div><div class="control-actions"><div class="review-strip" id="review" hidden><audio id="playback" controls aria-label="Listen to your recorded answer"></audio><button class="secondary-button" id="retake" type="button">Retake</button></div><button class="secondary-button" id="skip" type="button" hidden>Skip question</button><button class="record-button" id="main-action" type="button">Start speaking test</button></div></section>
</main>
<div class="complete-overlay" id="complete" hidden><div role="dialog" aria-modal="true" aria-labelledby="complete-title"><h2 id="complete-title">Speaking test complete</h2><p id="complete-text"></p><div id="answer-downloads"></div><button class="secondary-button" id="restart" type="button">Start again</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<!-- ROOM_RUNTIME -->
</body>
</html>
