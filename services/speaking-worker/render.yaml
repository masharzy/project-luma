services:
  - type: web
    name: jumptonine-speaking-worker
    runtime: docker
    dockerfilePath: ./services/speaking-worker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AI_LAB_MASTER_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SPEAKING_WORKER_TOKEN
        generateValue: true
